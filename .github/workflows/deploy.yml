name: Deploy Meeting Service

on:
  workflow_dispatch:

jobs:
  enable-maintenance:
    name: Enable maintenance mode
    runs-on: ubuntu-latest
    steps:
      - name: Enable maintenance through Meeting FastAPI
        env:
          MAINTENANCE_ON_URL: ${{ secrets.MEETING_MAINTENANCE_ON_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          echo "[maintenance:on] Starting maintenance enable request"
          test -n "$MAINTENANCE_ON_URL" || { echo "Missing MEETING_MAINTENANCE_ON_URL secret"; exit 1; }

          if [ -n "$MAINTENANCE_TOKEN" ]; then
            echo "[maintenance:on] MAINTENANCE_TOKEN is configured (length: ${#MAINTENANCE_TOKEN})"
          else
            echo "[maintenance:on] MAINTENANCE_TOKEN is empty"
            exit 1
          fi

          status=$(curl --silent --show-error --location --max-time 20             --output maintenance-on-response.txt             --dump-header maintenance-on-headers.txt             --write-out "%{http_code}"             --header "Authorization: Bearer $MAINTENANCE_TOKEN"             --request POST "$MAINTENANCE_ON_URL" || true)

          echo "[maintenance:on] HTTP status: $status"
          cat maintenance-on-response.txt || true

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "[maintenance:on] Request failed"
            exit 1
          fi

          echo "[maintenance:on] Maintenance enabled successfully"

  deploy:
    name: Deploy Meeting to EC2
    runs-on: ubuntu-latest
    needs: enable-maintenance
    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_PATH }}"
            git fetch origin main
            git checkout -f -B main origin/main
            ./venv/bin/pip install -r requirements.txt
            pm2 restart meeting-service
            echo "Meeting deployment completed successfully."

  selenium-smoke-tests:
    name: Meeting Selenium Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "153.0.8010.52"
          install-chromedriver: true

      - name: Install Selenium test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install selenium pytest

      - name: Wait for deployed Meeting page
        env:
          MEETING_URL: https://www.chakorahub.com/meeting
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 10 "$MEETING_URL" > /dev/null; then
              echo "Deployed Meeting website is responding."
              exit 0
            fi
            echo "Meeting website not ready (attempt $attempt/12)."
            sleep 10
          done

          echo "Deployed Meeting website did not become ready."
          exit 1

      - name: Run Selenium smoke tests
        env:
          HOME_URL: https://www.chakorahub.com
          MEETING_HOME_URL: https://www.chakorahub.com
          MEETING_URL: https://www.chakorahub.com/meeting
          MEETING_ADMIN_URL: https://www.chakorahub.com/meeting/admin
          EXPECT_MAINTENANCE_NOTICE: "true"
          RUN_MEETING_WRITE_TESTS: "false"
        run: |
          pytest -v test_meeting_smoke.py --junitxml=meeting-selenium-results.xml

      - name: Upload Selenium results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meeting-selenium-results
          path: meeting-selenium-results.xml
          if-no-files-found: warn

  disable-maintenance:
    name: Disable maintenance after passing tests
    runs-on: ubuntu-latest
    needs: selenium-smoke-tests
    if: ${{ needs.selenium-smoke-tests.result == 'success' }}
    steps:
      - name: Disable maintenance through Meeting FastAPI
        env:
          MAINTENANCE_OFF_URL: ${{ secrets.MEETING_MAINTENANCE_OFF_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          echo "[maintenance:off] Starting maintenance disable request"
          test -n "$MAINTENANCE_OFF_URL" || { echo "Missing MEETING_MAINTENANCE_OFF_URL secret"; exit 1; }

          if [ -n "$MAINTENANCE_TOKEN" ]; then
            echo "[maintenance:off] MAINTENANCE_TOKEN is configured (length: ${#MAINTENANCE_TOKEN})"
          else
            echo "[maintenance:off] MAINTENANCE_TOKEN is empty"
            exit 1
          fi

          status=$(curl --silent --show-error --location --max-time 20             --output maintenance-off-response.txt             --dump-header maintenance-off-headers.txt             --write-out "%{http_code}"             --header "Authorization: Bearer $MAINTENANCE_TOKEN"             --request POST "$MAINTENANCE_OFF_URL" || true)

          echo "[maintenance:off] HTTP status: $status"
          cat maintenance-off-response.txt || true

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "[maintenance:off] Request failed"
            exit 1
          fi

          echo "[maintenance:off] Maintenance disabled successfully"
